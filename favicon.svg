<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0F172A"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#grad)" stroke-width="32" filter="url(#shadow)"/>
  
  <!-- Color Dropper / Loupe Icon -->
  <g transform="translate(140, 140) scale(0.9)" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="70" stroke="url(#grad)" stroke-width="22" fill="#1E293B"/>
    <line x1="150" y1="150" x2="220" y2="220" stroke="#FFFFFF" stroke-width="24"/>
    <circle cx="100" cy="100" r="24" fill="#3B82F6" stroke="none"/>
    <!-- Crosshair -->
    <line x1="100" y1="50" x2="100" y2="70" stroke="#94A3B8" stroke-width="8"/>
    <line x1="100" y1="130" x2="100" y2="150" stroke="#94A3B8" stroke-width="8"/>
    <line x1="50" y1="100" x2="70" y2="100" stroke="#94A3B8" stroke-width="8"/>
    <line x1="130" y1="100" x2="150" y2="100" stroke="#94A3B8" stroke-width="8"/>
  </g>
</svg>